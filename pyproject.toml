[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketagent"
version = "0.3.0"
description = "A small, local-first AI agent with a local web panel, free brains with fallbacks (OpenRouter, Groq, Gemini, NVIDIA, GitHub Models, Cerebras, Ollama, LM Studio) and approval-gated computer use. Chat in the panel, the terminal or on Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pypdf>=5",                               # reading PDF files (pure Python); the only other package
    "tzdata; platform_system == 'Windows'",   # time zones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
pocketagent = "pocketagent.cli:main"

[tool.setuptools.packages.find]
include = ["pocketagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
