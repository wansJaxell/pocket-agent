[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketagent"
version = "0.1.0"
description = "A small, local-first AI agent with pluggable skills. Brain: any OpenAI-compatible API (Ollama, LM Studio, NVIDIA, OpenRouter, Groq). Chat in the terminal or on Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "tzdata; platform_system == 'Windows'",   # time zones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
pocketagent = "pocketagent.cli:main"

[tool.setuptools.packages.find]
include = ["pocketagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
